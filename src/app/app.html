<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schach</title>
<base href="/">
</head>
<body>

<header>
  <h1>♟ Schach</h1>
  <p>By Alex Gregor</p>
</header>

<div class="app">
  <!-- Board -->
  <div class="board-wrap">
    <div style="display:flex; align-items:center;">
      <div class="rank-labels" id="rankLabels"></div>
      <div class="board-outer">
        <div class="board" id="board"></div>
      </div>
    </div>
    <div class="file-labels" id="fileLabels"></div>
  </div>

  <!-- Side panel -->
  <div class="panel">
    <!-- Status -->
    <div class="card" id="statusCard">
      <div class="card-title">Turn</div>
      <div class="status-indicator">
        <div class="dot" id="dotW"></div>
        <span id="statusW" class="status-text">White</span>
      </div>
      <div class="status-indicator">
        <div class="dot" id="dotB"></div>
        <span id="statusB" class="status-text">Black</span>
      </div>
      <div class="game-over-msg" id="gameOverMsg" style="display:none"></div>
    </div>

    <!-- Captured -->
    <div class="card">
      <div class="card-title">Captured by White</div>
      <div class="captured-row" id="capturedByWhite"></div>
    </div>
    <div class="card">
      <div class="card-title">Captured by Black</div>
      <div class="captured-row" id="capturedByBlack"></div>
    </div>

    <!-- Moves -->
    <div class="card">
      <div class="card-title">Move History</div>
      <div class="move-history" id="moveHistory"></div>
    </div>

    <!-- Controls -->
    <div class="card">
      <div class="card-title">Controls</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button class="btn" (click)="undoMove()">↩ Undo Move</button>
        <button class="btn primary" (click)="newGame()">✦ New Game</button>
      </div>
    </div>
  </div>
</div>

<!-- Promotion modal -->
<div class="modal-overlay" id="promoModal" style="display:none">
  <div class="modal">
    <h3>Choose Promotion</h3>
    <div class="promo-pieces" id="promoPieces"></div>
  </div>
</div>
</body>
</html>
