server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve pre-compressed Brotli/gzip assets produced by the Angular build
    gzip_static on;

    # Cache hashed static assets (JS, CSS, fonts, images) for 1 year.
    # Angular's --output-hashing=all ensures these filenames change on every deploy.
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # For all other routes, fall back to index.html so Angular's
    # client-side router can handle deep-links and page refreshes.
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent caching of index.html so the browser always fetches
        # the latest shell on deploy
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
